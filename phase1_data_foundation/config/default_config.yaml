project_name: "Credit Card Fraud Detection"
data_path: ""
output_dir: "output"
model_dir: "models"
log_level: "INFO"

data_processing:
  missing_strategy: "auto"
  handle_outliers: true
  outlier_method: "iqr"
  outlier_strategy: "remove"
  encoding_method: "label"
  normalize: true
  normalization_method: "standard"
  test_size: 0.2
  random_state: 42
  stratify: true

feature_engineering:
  create_temporal_features: true
  create_amount_features: true
  create_behavioral_features: true
  create_statistical_features: true
  create_pca_features: true
  pca_components: 5
  feature_selection_method: "importance"
  n_features_to_select: 30

xgboost:
  objective: "binary:logistic"
  eval_metric: "auc"
  max_depth: 6
  learning_rate: 0.1
  n_estimators: 100
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: -1
  optimization_method: "optuna"
  n_trials: 100

isolation_forest:
  n_estimators: 100
  max_samples: "auto"
  contamination: 0.01
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1

oversampling:
  method: "adasyn"
  sampling_strategy: "auto"
  n_neighbors: 5
  random_state: 42
  auto_optimize: true

explainability:
  shap_explainer_type: "auto"
  max_evals: 1000
  use_lime: true
  calculate_permutation_importance: true
  n_repeats: 10

evaluation:
  cv_folds: 5
  cost_matrix:
    tn: 0
    fp: 1
    fn: 10
    tp: -2
  perform_threshold_analysis: true
  threshold_range: [0.1, 1.0]
  threshold_step: 0.05
